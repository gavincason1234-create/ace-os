name: Build ACE OS ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      # A single wrong package name only surfaces 15 minutes into the ISO
      # build, so check every name against the real archive up front.
      - name: Pre-flight — verify every package name exists in trixie
        run: |
          docker run --rm -v "$PWD":/w -w /w debian:trixie sh -c '
            set -e
            sed -i "s|^Components:.*|Components: main contrib non-free non-free-firmware|" \
              /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
            apt-get update -qq
            missing=""
            while read -r pkg; do
              case "$pkg" in ""|\#*) continue;; esac
              if ! apt-cache show "$pkg" >/dev/null 2>&1; then
                missing="$missing $pkg"
              fi
            done < config/package-lists/aceos.list.chroot
            if [ -n "$missing" ]; then
              echo "MISSING PACKAGES:$missing"
              exit 1
            fi
            echo "all package names resolve"
          '

      # The ASUS L510M's Celeron N4020 is Goldmont Plus: SSE4.2 but NO AVX.
      # Stock llama.cpp binaries assume AVX2 and die with "Illegal instruction"
      # on this CPU, so the engine is compiled here with every AVX path off.
      - name: Build local AI engine (no AVX)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential git
          git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_AVX512=OFF \
            -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_BMI2=OFF \
            -DGGML_SSE42=ON \
            -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF
          targets=$(cmake --build /tmp/llama.cpp/build --target help 2>/dev/null \
                    | sed 's/^\.\.\. //' | awk '{print $1}' | tr -d ':')
          echo "--- llama targets in this checkout ---"
          echo "$targets" | grep -i '^llama' || true
          echo "--------------------------------------"

          # Upstream renamed the old llama-cli (now llama-completion) and added
          # a unified llama-app that cannot link while the server is disabled,
          # so build one specific single-shot tool instead of "all".
          built=""
          for candidate in llama-completion llama-cli main; do
            if echo "$targets" | grep -qx "$candidate"; then
              cmake --build /tmp/llama.cpp/build --target "$candidate" -j"$(nproc)"
              built="$candidate"
              break
            fi
          done
          if [ -z "$built" ]; then
            echo "::error::no completion/CLI target in this llama.cpp checkout"
            echo "$targets" | head -60
            exit 1
          fi

          bin=$(find /tmp/llama.cpp/build -type f -name "$built" -perm -u+x \
                -not -name '*.o' | head -1)
          if [ -z "$bin" ]; then
            echo "::error::target $built built but no binary found"
            find /tmp/llama.cpp/build -type f -perm -u+x -not -name '*.o' | head -40
            exit 1
          fi
          echo "using engine binary: $bin (target $built)"

          mkdir -p config/includes.chroot/opt/ace-ai/bin
          cp "$bin" config/includes.chroot/opt/ace-ai/bin/llama-cli
          chmod 755 config/includes.chroot/opt/ace-ai/bin/llama-cli
          # Record the interface so any future flag rename is visible here.
          echo "--- engine interface ---"
          config/includes.chroot/opt/ace-ai/bin/llama-cli --help 2>&1 | head -40 || true

      - name: Build speech-recognition engine (no AVX)
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_AVX512=OFF \
            -DGGML_FMA=OFF -DGGML_F16C=OFF \
            -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF
          wtargets=$(cmake --build /tmp/whisper.cpp/build --target help 2>/dev/null \
                     | sed 's/^\.\.\. //' | awk '{print $1}' | tr -d ':')
          wbuilt=""
          for candidate in whisper-cli main; do
            if echo "$wtargets" | grep -qx "$candidate"; then
              cmake --build /tmp/whisper.cpp/build --target "$candidate" -j"$(nproc)"
              wbuilt="$candidate"
              break
            fi
          done
          if [ -z "$wbuilt" ]; then
            echo "no known whisper target; building everything"
            cmake --build /tmp/whisper.cpp/build -j"$(nproc)"
          fi
          bin=""
          for name in whisper-cli main whisper; do
            found=$(find /tmp/whisper.cpp/build -type f -name "$name" -perm -u+x \
                    -not -name '*.o' | head -1)
            if [ -n "$found" ]; then bin="$found"; break; fi
          done
          if [ -z "$bin" ]; then
            echo "::error::no whisper CLI binary found"
            find /tmp/whisper.cpp/build -type f -perm -u+x -not -name '*.o' | head -30
            exit 1
          fi
          echo "using speech binary: $bin"
          cp "$bin" config/includes.chroot/opt/ace-ai/bin/whisper-cli
          chmod 755 config/includes.chroot/opt/ace-ai/bin/whisper-cli

      - name: Verify the engine contains no AVX instructions
        run: |
          for bin in config/includes.chroot/opt/ace-ai/bin/llama-cli \
                     config/includes.chroot/opt/ace-ai/bin/whisper-cli; do
            # VEX-encoded (AVX) mnemonics would crash on Goldmont Plus.
            count=$(objdump -d "$bin" \
                    | grep -cE '\b(vmov|vadd|vmul|vsub|vfmadd|vbroadcast|vperm|vpxor|vzero)' \
                    || true)
            echo "$(basename "$bin"): AVX-style instructions = $count"
            if [ "$count" -ne 0 ]; then
              echo "::error::$(basename "$bin") contains AVX — it would crash on the N4020"
              exit 1
            fi
            ldd "$bin" || true
          done

      - name: Smoke-test the engine against a real model
        run: |
          mkdir -p /tmp/aitest
          curl -fL --retry 3 -o /tmp/aitest/model.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          # Only /opt needs root — creating $HOME paths with sudo would leave
          # them root-owned and the copy below would be denied.
          sudo mkdir -p /opt/ace-ai/bin
          sudo cp config/includes.chroot/opt/ace-ai/bin/llama-cli /opt/ace-ai/bin/
          mkdir -p "$HOME/.local/share/ace/models" "$HOME/.config/ace"
          cp /tmp/aitest/model.gguf "$HOME/.local/share/ace/models/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          echo '{"model":"0.5b"}' > "$HOME/.config/ace/config.json"

          echo "--- engine interface ---"
          /opt/ace-ai/bin/llama-cli --help 2>&1 | head -70 || true

          echo "--- direct minimal generation, stderr shown ---"
          printf 'Say hello in three words.' > /tmp/probe.txt
          /opt/ace-ai/bin/llama-cli \
            -m "$HOME/.local/share/ace/models/qwen2.5-0.5b-instruct-q4_k_m.gguf" \
            -f /tmp/probe.txt -n 16 -c 512 -t 2 --no-display-prompt 2>&1 \
            | tail -25 || true

          echo "--- ace selftest ---"
          python3 config/includes.chroot/usr/local/bin/ace --selftest

      - name: Build ISO
        run: ./build.sh

      - name: Build installer wheel
        run: |
          python3 -m pip install --user build
          python3 -m build --wheel --outdir dist installer

      - name: Prepare release assets
        run: |
          iso=$(ls ace-os-*.iso)
          # Stable asset names so the ace-os downloader and pip URL never change.
          mv "$iso" ace-os-amd64.iso
          mkdir -p release
          echo "ISO size: $(stat -c%s ace-os-amd64.iso) bytes"
          # SHA256SUMS doubles as the downloader's manifest: it lists the full
          # ISO and, when split, every part.
          sha256sum ace-os-amd64.iso > release/SHA256SUMS
          # GitHub release assets max out at 2 GiB — split larger ISOs.
          if [ "$(stat -c%s ace-os-amd64.iso)" -gt 2000000000 ]; then
            echo "::warning::ISO exceeds the 2 GB release-asset limit; the plain browser download link will not resolve until packages are trimmed"
            split -b 1900M -d ace-os-amd64.iso ace-os-amd64.iso.
            for part in ace-os-amd64.iso.[0-9]*; do
              mv "$part" "release/$part.part"
            done
            rm ace-os-amd64.iso
            (cd release && sha256sum *.part >> SHA256SUMS)
          else
            mv ace-os-amd64.iso release/
          fi
          mv dist/*.whl release/
          cp get-ace-os.py release/
          ls -lh release/

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest \
            --title "ACE OS (latest build)" \
            --notes "Automated build. See START-HERE.md for install steps." \
            || true

          # Remove assets from previous builds that this one does not replace.
          # Without this a stale ace-os-amd64.iso keeps being served from the
          # download link even when the current build was split into parts —
          # so the browser button would quietly hand out an old image.
          for stale in ace-os-amd64.iso ace-os-amd64.iso.00.part \
                       ace-os-amd64.iso.01.part ace-os-amd64.iso.02.part; do
            if [ ! -f "release/$stale" ]; then
              gh release delete-asset latest "$stale" --yes 2>/dev/null \
                && echo "removed stale asset: $stale" || true
            fi
          done

          gh release upload latest release/* --clobber

      - name: Upload ISO as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ace-os-iso
          path: release/*
          retention-days: 14
