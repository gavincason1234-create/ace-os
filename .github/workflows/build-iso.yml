name: Build ACE OS ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Build ISO
        run: ./build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ace-os-iso
          path: "*.iso"
          retention-days: 14
